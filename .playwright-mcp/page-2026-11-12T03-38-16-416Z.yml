  - paragraph [ref=e513]: The author's own readings, parsed from the written Market Pulse. The parser reads the report by its LABELS rather than by a date, because the report's format changed three times between 2024 and 2026.
  - heading "Do the calls beat the index?" [level=2] [ref=e514]
  - paragraph [ref=e515]: close on the post date; previous trading day for a weekend post. A claim is one ticker per post; a post that was bullish and bearish on the same name is excluded (0 such). "Same call on SPY" is the hit rate SPY itself would have scored on the identical dates and directions, so a post that only calls what the market did does not look like it has an edge. The excess is the stock's return minus SPY's, signed by the call's direction; it is real only when its 95% interval excludes zero.
