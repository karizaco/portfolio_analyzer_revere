            - heading "Tactical Plan of Action" [level=3] [ref=e229]:
              - text: Tactical Plan of Action
              - button [ref=e232] [cursor=pointer]
            - heading "1) Market Posture — Cautiously Constructive" [level=3] [ref=e236]:
              - text: 1) Market Posture — Cautiously Constructive
              - button [ref=e239] [cursor=pointer]
            - paragraph [ref=e243]: The technical picture is improving, with SPY, MDY, and IWM reclaiming their 10/20-day moving averages. QQQ has reclaimed its 10-day but continues to lag below the 20-day. While encouraging, breadth remains weak and actionable setups are limited.
            - list [ref=e244]:
              - listitem [ref=e245]:
                - paragraph [ref=e246]: Gradually increase activity as conditions improve, but remain selective.
              - listitem [ref=e247]:
                - paragraph [ref=e248]: Watch for higher highs, higher lows, and sustained support above key moving averages.
              - listitem [ref=e249]:
                - paragraph [ref=e250]: Let improving breadth and successful trades justify additional risk rather than anticipating a sustained rally.
            - heading "2) Leadership — Follow Proven Strength" [level=3] [ref=e251]:
              - text: 2) Leadership — Follow Proven Strength
              - button [ref=e254] [cursor=pointer]
            - paragraph [ref=e258]:
              - strong [ref=e259]: "Primary focus:"
              - text: Energy, Defensives, Healthcare, Utilities, and Consumer Cyclicals.
            - paragraph [ref=e260]:
              - strong [ref=e261]: "Lower priority:"
              - text: Technology, Industrials, and Materials until technical structures improve.
            - paragraph [ref=e262]: Favor stocks showing strong relative strength, constructive price action, and tight consolidations near highs. Distinguish genuine emerging leadership from temporary rebounds in damaged sectors. Avoid chasing rotation or bottom-fishing laggards.
            - heading "3) Entry Criteria — Quality and Confirmation" [level=3] [ref=e263]:
              - text: 3) Entry Criteria — Quality and Confirmation
              - button [ref=e266] [cursor=pointer]
            - paragraph [ref=e270]: "Focus on repeatable momentum setups:"
            - list [ref=e271]:
              - listitem [ref=e272]:
                - paragraph [ref=e273]: VCPs and volatility contractions with tightening price action and declining volume.
              - listitem [ref=e274]:
                - paragraph [ref=e275]: 2–5 day tight patterns and short flags following strong momentum.
              - listitem [ref=e276]:
                - paragraph [ref=e277]: Controlled pullbacks to rising 10/20-day moving averages.
              - listitem [ref=e278]:
                - paragraph [ref=e279]: Catalyst-driven momentum setups with exceptional volume and price strength.
            - paragraph [ref=e280]: Enter on clean breaks of well-defined pivots or 15/30-minute ORBs aligned with strong daily setups, relative strength, and expanding volume. Keep entries close to the trigger with clear invalidation levels. Avoid chasing extended moves, loose bases, and premature entries.
            - heading "4) Position Size & Risk — Gradually Earn Exposure" [level=3] [ref=e281]:
              - text: 4) Position Size & Risk — Gradually Earn Exposure
              - button [ref=e284] [cursor=pointer]
            - paragraph [ref=e288]: The improving technical picture supports selective participation, but weak breadth still warrants controlled risk.
            - list [ref=e289]:
              - listitem [ref=e290]:
                - paragraph [ref=e291]: Risk approximately 0.15%–0.35% of account equity per trade.
              - listitem [ref=e292]:
                - paragraph [ref=e293]: Start with ¼ to ½ normal position size, adjusted for stop distance.
              - listitem [ref=e294]:
                - paragraph [ref=e295]: Increase toward 0.50% risk per trade only as breadth improves and breakouts consistently work.
              - listitem [ref=e296]:
                - paragraph [ref=e297]: Keep aggregate open portfolio risk around 1%–2% until broader participation confirms.
              - listitem [ref=e298]:
                - paragraph [ref=e299]: Add only to winning positions; never average down.
            - paragraph [ref=e300]: Let market conditions and actual trading results determine how aggressively to deploy capital.
            - heading "5) Trade Management — Demand Follow-Through" [level=3] [ref=e301]:
              - text: 5) Trade Management — Demand Follow-Through
              - button [ref=e304] [cursor=pointer]
            - paragraph [ref=e308]: Momentum trades should demonstrate progress relatively quickly.
            - list [ref=e309]:
              - listitem [ref=e310]:
                - paragraph [ref=e311]:
                  - text: Breakout falls back into its base →
                  - strong [ref=e312]: cut or reduce
                  - text: .
              - listitem [ref=e313]:
                - paragraph [ref=e314]:
                  - text: Price violates the predefined breakout/ORB stop →
                  - strong [ref=e315]: exit
                  - text: .
              - listitem [ref=e316]:
                - paragraph [ref=e317]:
                  - text: Loss of the 10/20-day with deteriorating relative strength →
                  - strong [ref=e318]: reduce or exit
                  - text: .
              - listitem [ref=e319]:
                - paragraph [ref=e320]:
                  - text: No meaningful progress after several sessions →
                  - strong [ref=e321]: reassess
                  - text: .
              - listitem [ref=e322]:
                - paragraph [ref=e323]: Strong winners → trail using the 10/20-day moving averages as appropriate.
            - paragraph [ref=e324]: Protect capital when setups fail, but give exceptional leaders room to develop.
            - heading "6) What Changes the Posture" [level=3] [ref=e325]:
              - text: 6) What Changes the Posture
              - button [ref=e328] [cursor=pointer]
            - paragraph [ref=e332]:
              - strong [ref=e333]: "Become more aggressive if:"
            - list [ref=e334]:
              - listitem [ref=e335]:
                - paragraph [ref=e336]: SPY, MDY, and IWM hold their reclaimed moving averages and establish higher highs and higher lows.
              - listitem [ref=e337]:
                - paragraph [ref=e338]: QQQ reclaims its 20-day moving average and resumes leadership.
              - listitem [ref=e339]:
                - paragraph [ref=e340]: New highs expand and upside momentum consistently exceeds downside momentum.
              - listitem [ref=e341]:
                - paragraph [ref=e342]: More sectors transition from technical repair into sustained uptrends.
              - listitem [ref=e343]:
                - paragraph [ref=e344]: Stock scans expand and breakouts consistently produce follow-through.
            - paragraph [ref=e345]:
              - strong [ref=e346]: "Become more defensive if:"
            - list [ref=e347]:
              - listitem [ref=e348]:
                - paragraph [ref=e349]: Major indices lose their recently reclaimed 10/20-day moving averages.
              - listitem [ref=e350]:
                - paragraph [ref=e351]: Recent pivot lows fail and lower lows resume.
              - listitem [ref=e352]:
                - paragraph [ref=e353]: New lows and downside momentum begin expanding again.
              - listitem [ref=e354]:
                - paragraph [ref=e355]: Emerging leaders weaken and breakout failures increase.
              - listitem [ref=e356]:
                - paragraph [ref=e357]: Actionable setups remain scarce despite index strength.
            - heading "7) Daily Execution Checklist" [level=3] [ref=e358]:
              - text: 7) Daily Execution Checklist
              - button [ref=e361] [cursor=pointer]
            - paragraph [ref=e365]:
              - strong [ref=e366]: "Before the open:"
              - text: Review index trends, key moving averages, breadth, and sector leadership. Identify A+ setups with predefined entries, stops, and position sizes.
            - paragraph [ref=e367]:
              - strong [ref=e368]: "During the session:"
              - text: Execute only confirmed setups. Monitor volume, relative strength, and market participation. Avoid chasing and cut failed trades quickly.
            - paragraph [ref=e369]:
              - strong [ref=e370]: "After the close:"
              - text: Evaluate breakout success, breadth improvement, sector rotation, and open-position risk. Adjust the watchlist and trading posture accordingly.
            - separator [ref=e372]
            - heading "Bottom Line" [level=2] [ref=e373]:
              - text: Bottom Line
              - button [ref=e376] [cursor=pointer]
            - paragraph [ref=e380]: The market is showing early signs of technical repair, with broader index participation improving but breadth and momentum still lagging. The environment is becoming more constructive, but the limited number of quality setups argues against aggressive positioning.
            - paragraph [ref=e381]: "The playbook remains straightforward: follow genuine leadership, buy tight setups through precise pivots, start small, cut failures quickly, and add only when trades work. Stay prepared for improving conditions, but let expanding breadth, stronger momentum, and successful breakouts earn greater aggression."
