              - strong [ref=e154]: "Market Backdrop: Mixed"
            - paragraph [ref=e155]: Major indices showed improving price action Monday and Tuesday. SPY, MDY, and IWM reclaimed their 10-day and 20-day moving averages, while QQQ closed above its 10-day but remains below its 20-day. This is a constructive first step, but the indices still need to establish higher highs and higher lows while holding their reclaimed moving averages to confirm a more durable improvement in trend.
            - paragraph [ref=e156]: Sector leadership remains concentrated in defensive and select cyclical groups. Energy, Defensives, Healthcare, Utilities, and Consumer Cyclicals continue to show the strongest combination of relative strength and constructive technical action. Meanwhile, Technology, Industrials, and Materials continue to lag, with weaker price structures and poor relative strength. Although pockets of strength are emerging, ongoing rotation and narrow leadership continue to limit broader market participation.
            - paragraph [ref=e157]: Breadth and momentum have improved modestly but remain short of the levels typically associated with a healthy, sustained advance. Stock scans still produce few actionable setups, with many names below key moving averages and well off recent highs. For conditions to improve meaningfully, new highs need to expand, upside momentum must strengthen, and more stocks need to demonstrate sustained participation. Until then, the tape continues to favor patience, selectivity, and capital preservation.
