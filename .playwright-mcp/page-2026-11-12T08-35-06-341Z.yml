  - heading "Do the ticker calls beat the index?" [level=2] [ref=e712]
  - paragraph [ref=e713]: close on the post date; previous trading day for a weekend post. A claim is one ticker per post; a post that was bullish and bearish on the same name is excluded (1 such). "Same call on SPY" is the hit rate SPY itself would have scored on the identical dates and directions, so a post that only calls what the market did does not look like it has an edge. The excess is the stock's return minus SPY's, signed by the call's direction; it is real only when its 95% interval excludes zero.
